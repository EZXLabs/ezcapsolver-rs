# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html
#
# Every check runs with `cargo deny check`. Lint levels are "deny" (fails the
# check), "warn" (reported, does not fail) and "allow" (silent).

[graph]
# Audit optional dependencies as well, so the result matches CI, which builds
# and lints with `--all-features`.
all-features = true

# `cargo deny check advisories` — RustSec advisory database.
[advisories]
# Only flag unmaintained crates this project depends on directly; unmaintained
# transitive dependencies are usually outside the project's control.
unmaintained = "workspace"
# A yanked dependency is always actionable: bump the version.
yanked = "deny"
# Advisories to silence. Prefer upgrading the dependency over adding an entry,
# and always record why.
ignore = [
  # { id = "RUSTSEC-0000-0000", reason = "why this is acceptable here" },
]

# `cargo deny check licenses` — SPDX license policy for the dependency graph.
[licenses]
# Permissive licenses only. Copyleft (GPL / LGPL / AGPL) and weak copyleft
# (MPL-2.0) are intentionally absent: add one deliberately, with a reason, if a
# dependency ever requires it.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",         # unicode-ident 1.0.13 and newer
  "Unicode-DFS-2016",    # unicode-ident 1.0.12 and older
  "CDLA-Permissive-2.0",
]
# How closely a crate's license text must match the canonical SPDX text before
# it is accepted. This is the cargo-deny default; lowering it invites
# misdetection.
confidence-threshold = 0.8
# The list above is deliberately a superset that also covers dependencies this
# project may add later, so unused entries are not worth reporting.
unused-allowed-license = "allow"
# Per-crate escape hatch for a license that should not be allowed globally.
exceptions = [
  # { crate = "some-crate", allow = ["MPL-2.0"] },
]

[licenses.private]
# This crate is published, so its own license metadata is checked too.
ignore = false

# `cargo deny check bans` — dependency graph hygiene.
[bans]
# Duplicate versions are usually introduced by transitive dependencies and
# cannot be resolved locally, so they are reported without failing the build.
multiple-versions = "warn"
highlight = "all"
# `*` version requirements are rejected by crates.io on publish; catch them here.
wildcards = "deny"
# ...except for path and git dependencies, where `*` is normal.
allow-wildcard-paths = true
# Crates that must never enter the graph.
deny = [
  # { crate = "openssl", reason = "this project standardises on rustls" },
]
# Duplicate-version exemptions, each with a reason.
skip = [
  # { crate = "windows-sys@0.52", reason = "pulled in by an outdated transitive dep" },
]
# Like `skip`, but also covers the crate's entire dependency subtree.
skip-tree = [
  # { crate = "windows-sys@0.52", depth = 20 },
]

# `cargo deny check sources` — where crates are allowed to come from.
[sources]
# crates.io only; anything else has to be listed below on purpose.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
