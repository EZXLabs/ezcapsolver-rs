[package]
name = "ezcapsolver-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["EZXLabs <admin@ezxlabs.com>"]
description = "Rust SDK for EzCaptchaSolver."
documentation = "https://docs.rs/ezcapsolver-rs"
homepage = "https://ezxlabs.com"
repository = "https://github.com/EZXLabs/ezcapsolver-rs"
readme = "README.md"
license = "Apache-2.0"
keywords = ["captcha", "recaptcha", "funcaptcha", "hcaptcha", "cloudflare"]
categories = []
exclude = [".github/", ".pre-commit-config.yaml", "_typos.toml", "cliff.toml", "deny.toml"]

[lib]
name = "ezcapsolver"

# docs.rs builds with all features so both clients are documented, and sets the
# `docsrs` cfg so feature-gated items are rendered with a feature badge.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", optional = true }
bon = "3.10"
pastey = "0.2"
# Browser-side requests of the DataDome challenge flow, behind `datadome`.
lkrequest = { git = "https://github.com/EZXLabs/lkrequest-rs", version = "0.3", optional = true }
base64 = { version = "0.23", optional = true }
md-5 = { version = "0.11", optional = true }
regex = { version = "1", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = "0.3"
anyhow = "1"
base64 = "0.23"

[features]
default = ["blocking", "async"]
async = ["dep:reqwest", "dep:tokio", "dep:tracing"]
blocking = ["dep:reqwest", "dep:tracing", "reqwest/blocking"]
# Extension: the DataDome challenge workflow in `ext`, browser-side requests
# through a Chrome TLS fingerprint plus the three DataDomeTaskProxyless steps.
datadome = ["async", "dep:lkrequest", "dep:base64", "dep:md-5", "dep:regex", "dep:url"]

[[example]]
name = "datadome_workflow"
required-features = ["datadome"]


[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
