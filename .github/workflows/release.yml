name: Release

# When pushing a v* tag:
#    1. Generate a Changelog and create a GitHub Release
#    2. Build multi-platform binaries and attach them to the Release (automatically skipped for library projects)
#    3. Publish to crates.io (skipped for pre-release versions)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # Prerelease tags (containing '-', such as v1.0.0-rc.1) are not yet included in cliff's tag sequence; generate them using --unreleased.
          args: ${{ contains(github.ref_name, '-') && format('--unreleased --tag {0}', github.ref_name) || '--latest' }} --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGES.md
          token: ${{ secrets.GITHUB_TOKEN }}
          # SemVer pre-release versions (containing "-") are automatically marked as Pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}

  meta:
    name: Resolve package metadata
    runs-on: ubuntu-latest
    outputs:
      bin: ${{ steps.meta.outputs.bin }}
      has_bin: ${{ steps.meta.outputs.has_bin }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        shell: bash
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          echo "bin=$(jq -r '.packages[0].name' <<< "$meta")" >> "$GITHUB_OUTPUT"
          echo "has_bin=$(jq -r '[.packages[0].targets[] | select(.kind[] == "bin")] | length > 0' <<< "$meta")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: [changelog, meta]
    if: needs.meta.outputs.has_bin == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - name: Setup cross toolchain
        if: runner.os == 'Linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ needs.meta.outputs.bin }}
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          include: README.md,LICENSE
          leading-dir: true
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # To publish to crates.io: you need to configure CARGO_REGISTRY_TOKEN in the repository's Settings → Secrets;
  publish:
    name: Publish to crates.io
    needs: [meta, build]
    if: ${{ !failure() && !cancelled() && needs.meta.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Skip notice
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::notice::CARGO_REGISTRY_TOKEN secret is not configured; skipping crates.io publishing"
      - uses: actions/checkout@v7
        if: env.CARGO_REGISTRY_TOKEN != ''
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: env.CARGO_REGISTRY_TOKEN != ''
      # Abort when the tag does not match the Cargo.toml version, to prevent releasing a version that is inconsistent with the tag.
      - name: Verify tag matches package version
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          pkg=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$pkg" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match Cargo.toml version $pkg"
            exit 1
          fi
      - name: Publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
